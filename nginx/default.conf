# =========================================================================
# 1.  (HTTPS - Port 443)
# =========================================================================
server {
    listen 443 ssl;
    server_name dushyna.site;

    client_max_body_size 15M;

    # Path to certificate IONOS
    ssl_certificate /etc/letsencrypt/live/dushyna.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dushyna.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================================================================
# 2.  HTTP (Port 80)
# =========================================================================
server {
    listen 80;
    server_name localhost dushyna.site;

    client_max_body_size 15M;

    # frontend for  localhost and dushyna.site
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # proxy for API
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
