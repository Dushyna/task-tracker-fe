server {
    listen 80;
    server_name localhost dushyna.site;

    # Статика фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Универсальное проксирование на контейнер бэкенда внутри сети Docker
    location ^~ /api/ {
        proxy_pass http://backend:8080; # Имя сервиса из docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Блок для HTTPS (актуально только для сервера, локально он будет игнорироваться, если нет сертификатов)
server {
    listen 443 ssl;
    server_name dushyna.site;

    ssl_certificate /etc/letsencrypt/live/dushyna.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dushyna.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
